services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reporting-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_DB: "reporting_service"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
